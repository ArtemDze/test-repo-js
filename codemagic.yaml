workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: JestoraASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jestorapattern.studio
      vars:
        BUNDLE_ID: com.jestorapattern.studio
        APP_STORE_APPLE_ID: "6797531429"
        XCODE_PROJECT: newFirstApp.xcodeproj
        XCODE_SCHEME: newFirstApp
      xcode: latest
    scripts:
      - name: Set up code signing profiles
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          digits() { echo "$1" | tr -cd '0-9' | head -c 10; }
          TF="$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || true)"
          AS="$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)"
          LOCAL="$(/usr/bin/grep -m1 'CURRENT_PROJECT_VERSION' "$XCODE_PROJECT/project.pbxproj" | tr -cd '0-9')"
          TF="$(digits "${TF:-0}")"; TF="${TF:-0}"
          AS="$(digits "${AS:-0}")"; AS="${AS:-0}"
          LOCAL="$(digits "${LOCAL:-0}")"; LOCAL="${LOCAL:-0}"
          LATEST="$TF"
          for n in "$AS" "$LOCAL"; do
            if [ "$n" -gt "$LATEST" ]; then LATEST="$n"; fi
          done
          NEW=$((LATEST + 1))
          echo "Build numbers — TestFlight:$TF AppStore:$AS Local:$LOCAL → using $NEW"
          agvtool new-version -all "$NEW"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - matthewmendoza627@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Upload only — avoids external beta-review metadata failures; use Internal Testing in ASC.
        submit_to_testflight: false
        submit_to_app_store: false

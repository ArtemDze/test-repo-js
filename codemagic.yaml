workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Must match the App Store Connect API key name in Codemagic → Teams → Integrations
      app_store_connect: JestoraASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jestorapattern.studio
      vars:
        BUNDLE_ID: com.jestorapattern.studio
        XCODE_PROJECT: newFirstApp.xcodeproj
        XCODE_SCHEME: newFirstApp
      xcode: latest
    scripts:
      - name: Set up code signing profiles
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR"
          LATEST="$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || true)"
          if [[ -z "$LATEST" || "$LATEST" == "null" || "$LATEST" == *"error"* ]]; then
            LATEST=0
          fi
          echo "Latest TestFlight build: $LATEST"
          agvtool new-version -all "$((LATEST + 1))"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - matthewmendoza627@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Upload to ASC + submit to TestFlight (not full App Store review)
        submit_to_testflight: true
        submit_to_app_store: false
